<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusFix - Report Problem</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="dashboard">

        <header class="topbar">

            <div>
                <h1>CampusFix</h1>
                <p>Report a Campus Problem</p>
            </div>

            <div class="profile-icon">
                📝
            </div>

        </header>


        <div class="form-box">

            <h2>Report a Problem</h2>

            <p class="form-intro">
                Tell us about the problem you found on campus.
            </p>


            <form id="problemForm">

                <label>Problem Category</label>

                <select id="category">

                    <option value="">Select Category</option>

                    <option>Electricity</option>
                    <option>Water</option>
                    <option>Cleanliness</option>
                    <option>Classroom</option>
                    <option>Wi-Fi / Internet</option>
                    <option>Furniture</option>
                    <option>Other</option>

                </select>


                <label>Problem Title</label>

                <input
                    type="text"
                    id="problemTitle"
                    placeholder="Example: Classroom fan not working"
                >


                <label>Description</label>

                <textarea
                    id="description"
                    rows="5"
                    placeholder="Describe the problem..."
                ></textarea>


                <label>Location</label>

                <input
                    type="text"
                    id="location"
                    placeholder="Example: Block A, Room 204"
                >


                <label for="photo">📸 Upload Problem Photo</label>

<input
    type="file"
    id="photo"
    accept="image/*"
>


                <button type="submit">
                    Submit Complaint
                </button>

            </form>


            <p id="complaintMessage"></p>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
